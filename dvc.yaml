stages:
  preprocess:
    cmd: python src/preprocessing.py
    deps:
    - data/raw/TelcoCustomer_Churn.csv
    - src/preprocessing.py
    outs:
    - data/processed/train.csv
  train:
    cmd: python src/train.py
    deps:
    - data/processed/train.csv
    - src/evaluate.py
    - src/models.py
    - src/train.py
    outs:
    - models/best_model.pkl
